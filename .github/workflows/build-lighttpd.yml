name: Build and Release Lighttpd Single-File

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lighttpd/lighttpd1.4

      - name: Install Dependencies
        run: |
          apt update
          apt install -y autoconf automake libtool build-essential pkg-config libssl-dev libxml2-dev libsqlite3-dev uuid-dev libpcre2-dev zlib1g-dev

      - name: Compile x86_64
        run: |
          ./autogen.sh
          ./configure -C --enable-static --disable-shared --with-openssl --with-webdav-props --with-webdav-locks --with-pcre2
          make LIGHTTPD_STATIC=yes -j $(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-x86_64
          path: src/lighttpd

  build-arm64:
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lighttpd/lighttpd1.4

      - name: Install Cross-Compile Dependencies
        run: |
          dpkg --add-architecture arm64
          apt update
          # 【修改点 1】: 使用 Debian 官方的 crossbuild-essential-arm64 替代基础的 gcc 编译器
          apt install -y autoconf automake libtool crossbuild-essential-arm64 pkg-config libssl-dev:arm64 libxml2-dev:arm64 libsqlite3-dev:arm64 uuid-dev:arm64 libpcre2-dev:arm64 zlib1g-dev:arm64

      - name: Cross-Compile ARM64
        run: |
          ./autogen.sh
          # 【修改点 2】: 强制 pkg-config 检索 aarch64 的库路径
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG=aarch64-linux-gnu-pkg-config
          ./configure -C --host=aarch64-linux-gnu --enable-static --disable-shared --with-openssl --with-webdav-props --with-webdav-locks --with-pcre2
          make LIGHTTPD_STATIC=yes -j $(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-arm64
          path: src/lighttpd

  release:
    needs: [build-x86_64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Files
        run: |
          mv artifacts/lighttpd-x86_64/lighttpd ./lighttpd-x86_64
          mv artifacts/lighttpd-arm64/lighttpd ./lighttpd-arm64
          chmod +x ./lighttpd-*

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto_compile
          name: Latest
          files: |
            lighttpd-x86_64
            lighttpd-arm64
