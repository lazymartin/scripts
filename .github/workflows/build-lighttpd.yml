name: Build and Release Lighttpd Single-File

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lighttpd/lighttpd1.4

      - name: Install Dependencies
        run: |
          apt update
          apt install -y autoconf automake libtool build-essential pkg-config libssl-dev libxml2-dev libsqlite3-dev uuid-dev libpcre2-dev zlib1g-dev

      - name: Compile x86_64
        run: |
          ./autogen.sh

          # 写入需要静态内建的模块列表（包含系统默认加载的核心模块与你配置的模块）
          cat << 'EOF' > src/plugin-static.h
          PLUGIN_INIT(mod_rewrite)
          PLUGIN_INIT(mod_redirect)
          PLUGIN_INIT(mod_access)
          PLUGIN_INIT(mod_alias)
          PLUGIN_INIT(mod_indexfile)
          PLUGIN_INIT(mod_dirlisting)
          PLUGIN_INIT(mod_staticfile)
          PLUGIN_INIT(mod_deflate)
          PLUGIN_INIT(mod_setenv)
          PLUGIN_INIT(mod_openssl)
          PLUGIN_INIT(mod_extforward)
          PLUGIN_INIT(mod_auth)
          PLUGIN_INIT(mod_authn_file)
          PLUGIN_INIT(mod_webdav)
          EOF

          LIGHTTPD_STATIC=yes CPPFLAGS="-DLIGHTTPD_STATIC" ./configure -C \
            --enable-static \
            --disable-shared \
            --with-openssl \
            --with-webdav-props \
            --with-webdav-locks \
            --with-pcre2

          make LIGHTTPD_STATIC=yes -j $(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-x86_64
          path: src/lighttpd

  build-arm64:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lighttpd/lighttpd1.4

      - name: Install Cross-Compile Dependencies
        run: |
          dpkg --add-architecture arm64
          apt update
          apt install -y autoconf automake libtool crossbuild-essential-arm64 pkg-config libssl-dev:arm64 libxml2-dev:arm64 libsqlite3-dev:arm64 uuid-dev:arm64 libpcre2-dev:arm64 zlib1g-dev:arm64

      - name: Cross-Compile ARM64
        run: |
          ./autogen.sh

          # 写入需要静态内建的模块列表
          cat << 'EOF' > src/plugin-static.h
          PLUGIN_INIT(mod_rewrite)
          PLUGIN_INIT(mod_redirect)
          PLUGIN_INIT(mod_access)
          PLUGIN_INIT(mod_alias)
          PLUGIN_INIT(mod_indexfile)
          PLUGIN_INIT(mod_dirlisting)
          PLUGIN_INIT(mod_staticfile)
          PLUGIN_INIT(mod_deflate)
          PLUGIN_INIT(mod_setenv)
          PLUGIN_INIT(mod_openssl)
          PLUGIN_INIT(mod_extforward)
          PLUGIN_INIT(mod_auth)
          PLUGIN_INIT(mod_authn_file)
          PLUGIN_INIT(mod_webdav)
          EOF

          export PKG_CONFIG=pkg-config
          export PKG_CONFIG_DIR=""
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/

          LIGHTTPD_STATIC=yes CPPFLAGS="-DLIGHTTPD_STATIC" ./configure -C \
            --host=aarch64-linux-gnu \
            --enable-static \
            --disable-shared \
            --with-openssl \
            --with-webdav-props \
            --with-webdav-locks \
            --with-pcre2

          make LIGHTTPD_STATIC=yes -j $(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-arm64
          path: src/lighttpd

  release:
    needs: [build-x86_64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Files
        run: |
          mv artifacts/lighttpd-x86_64/lighttpd ./lighttpd-x86_64
          mv artifacts/lighttpd-arm64/lighttpd ./lighttpd-arm64
          chmod +x ./lighttpd-*

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto_compile
          name: Latest
          files: |
            lighttpd-x86_64
            lighttpd-arm64
