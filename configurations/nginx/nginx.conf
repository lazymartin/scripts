user  nobody nogroup;
worker_processes  4;

pid /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    charset utf-8;
    server_tokens off; # turn off server version showup
    
    log_format proxy '$proxy_protocol_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"'
                        '"$http_x_forwarded_for" $request_id ';
    
    # root /usr/share/nginx/html;
    root /mnt/dav; 

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    map $proxy_protocol_addr $proxy_forwarded_elem {
        ~^[0-9.]+$        "for=$proxy_protocol_addr";
        ~^[0-9A-Fa-f:.]+$ "for=\"[$proxy_protocol_addr]\"";
        default           "for=unknown";
    }

    map $http_forwarded $proxy_add_forwarded {
        "~^(,[ \\t]*)*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?)*([ \\t]*,([ \\t]*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?)*)?)*$" "$http_forwarded, $proxy_forwarded_elem";
        default "$proxy_forwarded_elem";
    }
        
    server {
        listen 80 default_server;
        server_name ${x_domain};
        return 301 https://$host$request_uri;
    }

    server {
        listen                     127.0.0.1:${fallback_port_http} ssl proxy_protocol;
        http2                      on;
        add_header Strict-Transport-Security "max-age=63072000; includeSubdomains" always;

        server_name                ${x_domain};

        ssl_protocols              TLSv1.3;

        ssl_certificate            /etc/ssl/web.crt;
        ssl_certificate_key        /etc/ssl/web.key;

        access_log                 /var/log/nginx/access.log proxy;#  off;
        error_log                  /var/log/nginx/error.log;

        set_real_ip_from           127.0.0.1;
        real_ip_header             proxy_protocol;

        #ssl_reject_handshake       on;
        ssl_session_timeout        1h;
        ssl_session_cache          shared:SSL:10m;
        ssl_early_data             on;

        ssl_session_tickets        on;

        location / {
            sub_filter                            $proxy_host $host;
            sub_filter_once                       off;

            auth_basic "Authorized Users Only";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_set_header Host                 $proxy_host;

            proxy_http_version                    1.1;
            proxy_cache_bypass                    $http_upgrade;

            proxy_ssl_server_name                 on;

            proxy_set_header Upgrade              $http_upgrade;
            proxy_set_header Connection           $connection_upgrade;
            proxy_set_header X-Real-IP            $proxy_protocol_addr;
            proxy_set_header Forwarded            $proxy_add_forwarded;
            proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto    $scheme;
            proxy_set_header X-Forwarded-Host     $host;
            proxy_set_header X-Forwarded-Port     $server_port;

            proxy_connect_timeout                 60s;
            proxy_send_timeout                    60s;
            proxy_read_timeout                    60s;

            proxy_set_header Early-Data           $ssl_early_data;
        }
    }    
}


